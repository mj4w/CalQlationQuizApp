<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/practiceMode/practiceMode.css' %}">
  <link rel="icon" href="{% static 'img/logo.png' %}">
  <title>Student - Select</title>
</head>
<body>

  <header>
    <div class="logo-container">
        <span class="logo-text">CALQLATED</span>
    </div>
  </header>
  <div id="solo">
    <p>Solo</p>
  </div>
    <div class="warning-section">
    <div class="warning-icon" title="Warning!">
      <i class="fas fa-exclamation-triangle"></i>
    </div>
    <span class="warning-message">• All questions are required to be answered.</span>
  </div>
  <form method="POST">
    {% csrf_token %}
    <div class="quiz-settings">
      <div class="section">
          <label>Level of Difficulty</label>
          {{form.difficulty}}
          <div>
            <i class="fa-solid fa-caret-down"></i>
          </div>
      </div>
      <div class="section">
          <label>Number of Questions</label>
          {{form.num_questions}}
      </div>
      <label class="switch-container">
        Change to Slider Form:
        <label class="switch">
            <input type="checkbox" id="showCorrectAnswer" name="change_form">
            <span class="slider"></span>
        </label>
    </label>
      <div class="section">
        <button id="startButton" type="submit">Start</button>
      </div>
    </div>
  </form>
  <nav class="bottom-nav">
    <a href="{% url 'home' %}"><i class="fas fa-home"></i></a> <!-- Home icon -->
    <a href="{% url 'student-home' %}" onclick="window.history.back();"><i class="fa-solid fa-arrow-rotate-left"></i></a>
  </nav>

</body>
</html>
