<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question | SOLO</title>
    <link rel="stylesheet" href="{% static 'css/question/questionDefault.css' %}">
    
    <link rel="stylesheet" href="https://unpkg.com/mathlive/dist/mathlive-static.css" />
</head>
<body>
<div id="quiz-container">
    {% for question in questions %}
    <div class="question-container" data-question-id="{{ question.id }}">
        <!-- <h1>{{practice_mode_instance_id}}</h1> -->
        <div class="hint">
            <img src="{% static 'img/bulb.png' %}" alt="Hint" onclick="showHint('{{ question.id }}')">
          </div>
          <div class="hint-container" id="hintContainer{{ question.id }}" style="display: none;">
            <p class="mathlive">{{ question.hint_question }} </p>
        </div>
        <div class="slide">
            <div class="question">
                <div class="text-question mathlive">
                  <p>{{ question.question_text }}</p>
      
                </div>
                {% autoescape off %}
                <div class="mathlive text-question">
                
                  <p>{{ question.question_formula }}</p>
               
                </div>
                
                {% endautoescape %}
            </div>
            <div class="choices">
                <input type="radio" id="answer{{ question.id }}A" name="answer_{{ question.id }}" value="{{ question.option_a }}">
                <label class="mathlive" for="answer{{ question.id }}A">{{ question.option_a }}</label> 
                <input type="radio" id="answer{{ question.id }}B" name="answer_{{ question.id }}" value="{{ question.option_b }}">
                <label class="mathlive" for="answer{{ question.id }}B">{{ question.option_b }}</label> 
                <input type="radio" id="answer{{ question.id }}C" name="answer_{{ question.id }}" value="{{ question.option_c }}">
                <label class="mathlive" for="answer{{ question.id }}C">{{ question.option_c }}</label> 
            </div>
        </div>
    </div>
    {% endfor %}

    <div class="navigation-buttons">
        <button id="prevButton" style="display: none;" onclick="prevQuestion()">Previous</button>
        <button id="nextButton" style="display: none;" onclick="nextQuestion()">Next</button>
    </div>
    <input type="hidden" id="practiceModeInstanceId" value="{{ practice_mode_instance_id }}">
    <div id="result"></div>
</div>

<script src="{% static 'js/question/questionDefaultSolo.js' %}"></script>
<script type="module">
    import { convertLatexToMarkup }
      from 'https://unpkg.com/mathlive/dist/mathlive.min.mjs';
  
    function  replaceSpaces(input) {
      if (input == null) return "";
      var output = input.toString().replace(/ /g,"\\; ");
      return "$$" + output + "$$";
    }
  
    var elements = document.getElementsByClassName("mathlive");
    for (let i = 0; i < elements.length; i++) {
      var el = elements[i];
      el.innerHTML = convertLatexToMarkup(
        replaceSpaces(el.innerText), {
          letterShapeStyle: 'iso',
                 mathstyle: 'textstyle'
        }
      );
    }
  </script>
  <script>
    function showHint(index) {
      var hintContainer = document.getElementById("hintContainer" + index);
      if (hintContainer.style.display === 'none') {
        hintContainer.style.display = 'block';
        hintContainer.style.position = 'absolute'; // Set position to absolute
        hintContainer.style.zIndex = '1000'; // Set higher z-index to overlap questions
      } else {
        hintContainer.style.display = 'none';
      }
    }
  </script>
</body>
</html>
