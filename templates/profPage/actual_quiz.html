<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/prof/actual_quiz.css' %}">
    <link rel="stylesheet" href="https://unpkg.com/mathlive/dist/mathlive-static.css" />
    <link rel="icon" href="{% static 'img/logo.png' %}">
</head>
<body>

<div id="container">
    <form method="POST" action="{% url 'actual-quiz' id=quiz_setting.id %}" enctype="multipart/form-data" >
        {% csrf_token %}
        <div class="form-group">
            <label for="textInput">Question Text:</label>
            <textarea id="textInput" rows="4" cols="50" name="add_text" required></textarea>
        </div>
    
        <div class="form-group">
            <label for="mathInput">Math Equation Generator:</label>
            <math-field id="formula" style="display: block;">
            </math-field>                
            <input type="hidden" id="latex" name="add_equation">

        </div>
    
        <div class="form-group">
            <input type="file" id="photoInput" accept="image/*" name="upload_photo" class="hidden-upload-input">
            <label for="photoInput" class="custom-upload-label">
                <i class="fas fa-plus"></i>
            </label>
        </div>
    
        <div class="form-group choices">
            <label for="choice1">A.</label>
            <math-field id="formula1" style="display: block;">
            </math-field>                
            <input type="hidden" id="latex1" name="option_a">
    
            <label for="choice2">B.</label>
            <math-field id="formula2" style="display: block;">
            </math-field>                
            <input type="hidden" id="latex2" name="option_b">
    
            <label for="choice3">C.</label>
            <math-field id="formula3" style="display: block;">
            </math-field>                
            <input type="hidden" id="latex3" name="option_c">
        </div>
        <div>
            <label for="correct">Correct Answer</label>
            <math-field id="formula4" style="display: block;">
            </math-field>                
            <input type="hidden" id="latex4" name="answer">
        </div>
        <div>
            <label for="solution">Put Solution Here</label>
            <input type="file" name="solution" id="solution" required>
        </div>
        <button class="submit-btn" type="submit">Submit</button>
    </form>
    <button class="done-btn"><a href="{% url 'get-link' id=quiz_setting.id  %}">Done</a></button>
    
</div>
<script type="module">
    import { convertLatexToMarkup }
      from 'https://unpkg.com/mathlive/dist/mathlive.min.mjs';
  
    function  replaceSpaces(input) {
      if (input == null) return "";
      var output = input.toString().replace(/ /g,"\\; ");
      return "$$" + output + "$$";
    }
  
    var elements = document.getElementsByClassName("mathlive");
    for (let i = 0; i < elements.length; i++) {
      var el = elements[i];
      el.innerHTML = convertLatexToMarkup(
        replaceSpaces(el.innerText), {
          letterShapeStyle: 'iso',
                 mathstyle: 'textstyle'
        }
      );
    }
    
</script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const formulaInput = document.getElementById('formula');
        const latexInput = document.getElementById('latex');
    
        formulaInput.addEventListener('change', function() {
            latexInput.value = formulaInput.latex();
        });
    });
    document.addEventListener('DOMContentLoaded', function() {
        const formulaInput1 = document.getElementById('formula1');
        const latexInput1 = document.getElementById('latex1');
    
        formulaInput1.addEventListener('change', function() {
            latexInput1.value = formulaInput1.latex();
        });
    });
    document.addEventListener('DOMContentLoaded', function() {
        const formulaInput2 = document.getElementById('formula2');
        const latexInput2 = document.getElementById('latex2');
    
        formulaInput2.addEventListener('change', function() {
            latexInput.value = formulaInput2.latex();
        });
    });
    document.addEventListener('DOMContentLoaded', function() {
        const formulaInput3 = document.getElementById('formula3');
        const latexInput3 = document.getElementById('latex3');
    
        formulaInput3.addEventListener('change', function() {
            latexInput3.value = formulaInput3.latex();
        });
    });
    document.addEventListener('DOMContentLoaded', function() {
        const formulaInput4 = document.getElementById('formula4');
        const latexInput4 = document.getElementById('latex4');
    
        formulaInput4.addEventListener('change', function() {
            latexInput4.value = formulaInput4.latex();
        });
    });
</script>

<script>
    const mf = document.getElementById("formula");
    const latex = document.getElementById("latex");

    mf.addEventListener("input",(ev) => latex.value = mf.value);

    latex.value = mf.value;

    // Listen for changes in the "latex" text field, 
    // and reflect its value in the mathfield.

    latex.addEventListener("input", (ev) => 
        mf.setValue(
        ev.target.value, 
        {silenceNotifications: true}
        )
    );

    const mf1 = document.getElementById("formula1");
    const latex1 = document.getElementById("latex1");

    mf1.addEventListener("input",(ev) => latex1.value = mf1.value);

    latex1.value = mf1.value;

    // Listen for changes in the "latex" text field, 
    // and reflect its value in the mathfield.

    latex1.addEventListener("input", (ev) => 
        mf1.setValue(
        ev.target.value, 
        {silenceNotifications: true}
        )
    );

    const mf2 = document.getElementById("formula2");
    const latex2 = document.getElementById("latex2");

    mf2.addEventListener("input",(ev) => latex2.value = mf2.value);

    latex2.value = mf2.value;

    // Listen for changes in the "latex" text field, 
    // and reflect its value in the mathfield.

    latex2.addEventListener("input", (ev) => 
        mf2.setValue(
        ev.target.value, 
        {silenceNotifications: true}
        )
    );

    const mf3 = document.getElementById("formula3");
    const latex3 = document.getElementById("latex3");

    mf3.addEventListener("input",(ev) => latex3.value = mf3.value);

    latex3.value = mf3.value;

    // Listen for changes in the "latex3" text field, 
    // and reflect its value in the mathfield.

    latex3.addEventListener("input", (ev) => 
        mf3.setValue(
        ev.target.value, 
        {silenceNotifications: true}
        )
    );

    const mf4 = document.getElementById("formula4");
    const latex4 = document.getElementById("latex4");

    mf4.addEventListener("input",(ev) => latex4.value = mf4.value);

    latex4.value = mf4.value;

    // Listen for changes in the "latex4" text field, 
    // and reflect its value in the mathfield.

    latex4.addEventListener("input", (ev) => 
        mf4.setValue(
        ev.target.value, 
        {silenceNotifications: true}
        )
    );
</script>
<nav class="bottom-nav">
    <a href="{% url 'home' %}"><i class="fas fa-home"></i></a> <!-- Home icon -->
    <a href="{% url 'create-quiz' %}" onclick="window.history.back();"><i class="fa-solid fa-arrow-rotate-left"></i></a>
</nav>
</body>
</html>
