<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/prof/create_quiz.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="{% static 'img/logo.png' %}">
    <title>Setup Quiz</title>
</head>
<body>


    <form method="POST" action="">
        {% csrf_token %}
        <div class="quiz-setup-container">
            <div class="warning-section">
                <div class="warning-icon" title="">
                    <i class="fa-solid fa-exclamation"></i>
                </div>
                <span class="warning-message">Please note: Once you submit the create quiz, you won't be able to return to this page</span>
            </div>
            <h1>Setup your Quiz</h1>

            <label for="quizDate">Start Date:</label>
            <input type="date" id="quizDate" name="date" required>

            <label for="quizEndDate">End Date:</label>
            <input type="date" id="quizEndDate" name="end_date" required>

            <label for="startTime">Start Time:</label>
            <input type="time" id="startTime" name="start_time" required>

            <label for="endTime">End Time:</label>
            <input type="time" id="endTime" name="end_time" required>

            <label for="section">Class Section:</label>
            <input type="text" id="section" name="section" required>
            <label class="switch-container">
                Show Correct Answer:
                <label class="switch">
                    <input type="checkbox" id="showCorrectAnswer" name="show_correct_answer">
                    <span class="slider"></span>
                </label>
            </label>

            <label class="switch-container">
                Show Solution After Quiz:
                <label class="switch">
                    <input type="checkbox" id="showSolution" name="show_solution">
                    <span class="slider"></span>
                </label>
            </label>

            <label for="questionTimer">Timer (seconds):</label>
            <input type="number" id="questionTimer" min="1" value="10" name="question_timer" required>

            <a href="{% url 'professor-home' %}" style="color: white;">Back</a>
            <button type="submit">Next</button>
        </div>
    </form>
</body>
</html>
