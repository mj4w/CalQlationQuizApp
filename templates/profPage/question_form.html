<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question | ProfCreate </title>
    <link rel="stylesheet" href="{% static 'css/question/quiz_form.css' %}">
    <link rel="icon" href="{% static 'img/logo.png' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/mathlive/dist/mathlive-static.css" />
    <!-- CSS -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css"/>
    <!-- Default theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/themes/default.min.css"/>
</head>
<body>
    <style>
  .loader-container {
    display: flex;
    justify-content: center; /* Center horizontally */
    align-items: center; /* Center vertically */
  }

  .loader {
    /* Your existing loader styles */
    border: 16px solid #f3f3f3;
    border-radius: 50%;
    border-top: 16px solid #3498db;
    width: 30px;
    height: 30px;
    -webkit-animation: spin 2s linear infinite; /* Safari */
    animation: spin 2s linear infinite;
  }

  /* Safari */
  @-webkit-keyframes spin {
    0% { -webkit-transform: rotate(0deg); }
    100% { -webkit-transform: rotate(360deg); }
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
    <div id="timerDisplay" class="timer"></div>
    <div id="quiz-container">
    {% for question in questions %}
    <div class="question-container" data-question-id="{{ question.id }}">
        <!-- <h1>{{practice_mode_instance_id}}</h1> -->
        <div class="slide">
            <div class="question">
                <div class="text-question mathlive">
                    <p>{{ question.add_text }}</p>

                </div>
                {% autoescape off %}
                <div class="mathlive text-question">

                    <p>{{ question.add_equation }}</p>

                </div>

                {% endautoescape %}
            </div>
            {% if question.upload_photo %}
            <div class="photo-container">
            <img src="{{ question.upload_photo.url }}" alt="Answer Photo">
            </div>
            {% endif %}
            <div class="choices">
                <input type="radio" id="answer{{ question.id }}A" name="answer_{{ question.id }}" value="{{ question.option_a }}">
                <label class="mathlive" for="answer{{ question.id }}A">{{ question.option_a }}</label>
                <input type="radio" id="answer{{ question.id }}B" name="answer_{{ question.id }}" value="{{ question.option_b }}">
                <label class="mathlive" for="answer{{ question.id }}B">{{ question.option_b }}</label>
                <input type="radio" id="answer{{ question.id }}C" name="answer_{{ question.id }}" value="{{ question.option_c }}">
                <label class="mathlive" for="answer{{ question.id }}C">{{ question.option_c }}</label>
            </div>
        </div>
    </div>
    {% endfor %}

    <div class="navigation-buttons">
        <button id="prevButton" style="display: none;" onclick="prevQuestion()">Previous</button>
        <button id="nextButton" style="display: none;" onclick="nextQuestion()">Next</button>
        <div class="loader-container" style="display: none;">
          <div class="loader"></div>
        </div>
    </div>
    <input type="hidden" id="practiceModeInstanceId" value="{{ id }}">
    <div id="result"></div>
</div>
<nav class="bottom-nav">
    <a href="{% url 'professor-home' %}" onclick="window.history.back();"><i class="fa-regular fa-circle-xmark"></i></a>
</nav>
<script src="{% static 'js/question/questionProf.js' %}"></script>
<script>
    // Countdown Timer
    const quizDurationSeconds = {{  time_limit }}; // Example: 100 seconds
    const timerDisplay = document.getElementById('timerDisplay');

    function updateTimerDisplay(remainingTime) {
      const minutes = Math.floor(remainingTime / 60);
      const seconds = remainingTime % 60;
      timerDisplay.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }

    let remainingTime = quizDurationSeconds;

    const timerInterval = setInterval(() => {
      remainingTime--;

      updateTimerDisplay(remainingTime);

      if (remainingTime <= 0) {
        clearInterval(timerInterval);
        timerDisplay.textContent = 'Time Up!';
        submitQuiz(); // Trigger quiz submission when time is up
      }
    }, 1000); // Update timer every second
    </script>
    <script type="module">
    import { convertLatexToMarkup }
        from 'https://unpkg.com/mathlive/dist/mathlive.min.mjs';

    function  replaceSpaces(input) {
        if (input == null) return "";
        var output = input.toString().replace(/ /g,"\\; ");
        return "$$" + output + "$$";
    }

    var elements = document.getElementsByClassName("mathlive");
    for (let i = 0; i < elements.length; i++) {
        var el = elements[i];
        el.innerHTML = convertLatexToMarkup(
        replaceSpaces(el.innerText), {
            letterShapeStyle: 'iso',
                    mathstyle: 'textstyle'
        }
        );
    }
    </script>
      <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>
</body>
</html>
